name: Monitor cartelera Showcase

# Nombre de cada corrida en la pestaña Actions, según quién la disparó.
run-name: >-
  ${{ github.event_name == 'schedule' && '⏰ Automática (GitHub)'
  || inputs.origen == 'cron-job' && '🤖 Automática (cron-job)'
  || format('👤 Manual: {0}', inputs.modo || 'normal') }}

on:
  schedule:
    # Cada 10 minutos, en los minutos 3, 13, 23... (evita el minuto 0, el más
    # congestionado en GitHub). El horario de GitHub es UTC; con "cada 10 min" da igual.
    # GitHub no garantiza puntualidad: puede demorar algunos minutos o saltear corridas.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecución"
        type: choice
        default: normal
        options:
          - normal
          - simulacro
          - probar-telegram
          - simular-nueva
          - simular-fecha
      filmid:
        description: "filmid (solo para simular-nueva / simular-fecha). Para la versión IMAX: 6028-imax"
        type: string
        default: ""
      origen:
        description: "Quién lo dispara (dejalo en 'manual'; cron-job.org manda 'cron-job')"
        type: string
        default: manual

# Permiso para commitear los archivos de estado.
permissions:
  contents: write

# Nunca dos corridas a la vez (se pisarían el estado).
concurrency:
  group: monitor-showcase
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v5
        with:
          # Siempre la ÚLTIMA versión de main (con el estado más nuevo), y no la
          # del momento en que se disparó la corrida. Si no, una corrida que
          # esperó en cola, o un "Re-run" de una corrida vieja, trabajaría con
          # un estado viejo y lo pisaría al guardar.
          ref: main

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Cache del navegador de Playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar Chromium para Playwright
        run: python -m playwright install --with-deps chromium

      - name: Correr el monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ inputs.modo || 'normal' }}
          FILMID: ${{ inputs.filmid || '' }}
        run: python monitor.py --modo "$MODO" --filmid "$FILMID"

      - name: Guardar el estado en el repo
        # always(): aunque el paso anterior falle, se guarda lo que haya quedado
        # (el script siempre deja los JSON en un estado consistente).
        if: always() && (inputs.modo || 'normal') != 'simulacro'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "El estado no cambió; no hay nada que commitear."
            exit 0
          fi
          git commit -m "Actualizar estado de la cartelera"
          for intento in 1 2 3; do
            # -X theirs: si hay conflicto en state/, gana la versión de ESTA corrida (la más nueva).
            if git pull --rebase -X theirs && git push; then
              echo "Estado guardado en el repo."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Falló el push (intento $intento); reintento..."
            sleep 5
          done
          echo "::error title=No se pudo guardar el estado::El push de state/ falló 3 veces. La próxima corrida va a trabajar con el estado anterior. Revisá Settings → Actions → General → Workflow permissions (Read and write)."
          exit 1
